# Orologio di Ulisse: l'unico workflow con orari, avvia gli altri.
# GitHub esegue gli orari solo se l'ultima modifica a queste righe è stata
# fatta da una persona del repository: se le esecuzioni automatiche non partono,
# apri questo file su GitHub, cambia un carattere in questo commentozz e salva.
name: Orologio

on:
  schedule:
    - cron: '*/30 * * * *'      # notizie ogni mezz'ora
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  avvia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Notizie
        run: gh workflow run notizie.yml -R ${{ github.repository }}
      # GitHub fa partire l'orologio quando vuole (anche con ore di ritardo):
      # invece di finestre esatte, ogni lavoro parte se è passato abbastanza dall'ultimo giro.
      - name: Capire al volo (ogni 2 ore circa, dalle 6 alle 23 ora italiana)
        run: |
          H=$((10#$(TZ=Europe/Rome date +%H)))
          ULT=$(gh api "repos/${{ github.repository }}/actions/workflows/capire.yml/runs?per_page=1" -q '.workflow_runs[0].created_at // "1970-01-01T00:00:00Z"')
          ORE=$(( ($(date +%s) - $(date -d "$ULT" +%s)) / 60 ))
          echo "ultimo Capire $ORE minuti fa"
          if [ $H -ge 6 ] && [ $H -le 23 ] && [ $ORE -ge 110 ]; then gh workflow run capire.yml -R ${{ github.repository }}; fi
      - name: Redazione notturna (una volta a notte, dall'1 alle 9)
        run: |
          H=$((10#$(TZ=Europe/Rome date +%H)))
          ULT=$(gh api "repos/${{ github.repository }}/actions/workflows/redazione.yml/runs?per_page=1" -q '.workflow_runs[0].created_at // "1970-01-01T00:00:00Z"')
          ORE=$(( ($(date +%s) - $(date -d "$ULT" +%s)) / 3600 ))
          echo "ultima Redazione $ORE ore fa"
          if [ $H -ge 1 ] && [ $H -le 9 ] && [ $ORE -ge 14 ]; then gh workflow run redazione.yml -R ${{ github.repository }}; fi
