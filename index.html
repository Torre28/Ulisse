<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ulisse</title>
<meta name="theme-color" content="#14202b">
<meta name="description" content="Ulisse: notizie con contesto, scoperta di passioni, ripasso e missioni di equilibrio.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
:root{
  --bg:#eef1f4; --panel:#f8fafb; --paper:#ffffff; --ink:#15202b; --muted:#5a6878; --line:#d3dbe3; --soft:#e7ecf1;
  --accent:#15202b; --on-accent:#f8fafb; --hl:#fff1c2; --ok:#1f7a4d; --bad:#b0392a;
  --lavoro:#2b63c4; --fede:#8a3cb2; --famiglia:#c4542b; --amici:#c48a12; --corpo:#1f8a6a; --mondo:#b0392a; --scoperta:#0b7d8f;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Serif 4",Georgia,serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1218; --panel:#131a22; --paper:#18212b; --ink:#e4e9ef; --muted:#93a0ae; --line:#2b3644; --soft:#1e2833;
    --accent:#e4e9ef; --on-accent:#0d1218; --hl:#3b3318; --ok:#49c08a; --bad:#ff7a66;
    --lavoro:#6ea0ff; --fede:#c986f1; --famiglia:#ff8f63; --amici:#f0bb45; --corpo:#4fd0a8; --mondo:#ff7a66; --scoperta:#45c9dc;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--scoperta)}
h1,h2,h3{font-family:var(--f-display);font-stretch:80%;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:34px;font-weight:800}
h2{font-size:24px;font-weight:750}
h3{font-size:19px;font-weight:700}
.mono,.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.wrap{max-width:760px;margin:0 auto;padding:16px max(14px,env(safe-area-inset-left,0px)) 24px max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.iconbtn{all:unset;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--paper)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.flat{background:var(--panel)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{cursor:pointer;font-family:var(--f-mono);font-size:12.5px;padding:9px 13px;border-radius:8px;border:1px solid var(--line);background:var(--paper);display:inline-flex;gap:6px;align-items:center;justify-content:center}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.small{padding:6px 9px;font-size:11.5px}
.btn.ghost{background:transparent}
.btn[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--ink);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.chip{cursor:pointer;font-family:var(--f-mono);font-size:12px;padding:6px 10px;border:1px solid var(--line);background:var(--paper);border-radius:999px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.scrollx{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
.tag{font-family:var(--f-mono);font-size:10.5px;padding:2px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.dotc{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
input[type=text],input[type=search],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
textarea{min-height:90px;resize:vertical}
label.lab{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.empty{color:var(--muted);font-style:italic}
.small{font-size:14px}
hr{border:0;border-top:1px dashed var(--line);margin:4px 0;width:100%}

/* nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px);height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
nav.bottom button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
nav.bottom button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
nav.bottom button[aria-current="page"]{color:var(--ink)}
nav.bottom button[aria-current="page"] svg{stroke-width:2.3}

/* quests */
.quest{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--soft)}
.quest:first-of-type{border-top:0}
.check{all:unset;cursor:pointer;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;margin-top:2px}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.quest.done .qt{text-decoration:line-through;color:var(--muted)}
.qt{font-size:16px;line-height:1.35}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.bar{display:grid;grid-template-columns:96px minmax(0,1fr) 28px;gap:8px;align-items:center;font-size:13.5px}
.bar .track{height:9px;background:var(--soft);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;border-radius:5px}
.bar .n{font-family:var(--f-mono);font-size:12px;text-align:right;color:var(--muted)}

/* news */
.news h3{font-size:18px}
.news .src{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.news p{margin:0;font-size:15px;color:var(--muted)}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-14px;background:var(--bg);padding:8px 0;z-index:2}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--on-accent);padding:10px 16px;border-radius:999px;font-family:var(--f-mono);font-size:12.5px;z-index:60;max-width:90vw;text-align:center}

/* lesson engine */
.lesson-head{display:flex;flex-direction:column;gap:6px}
.chapters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chapters::-webkit-scrollbar{display:none}
.chapters .chip small{opacity:.7;margin-left:4px}
.prose p{margin:0 0 .7em}
.prose p:last-child{margin-bottom:0}
.prose ul{margin:.2em 0 .7em;padding-left:1.2em}
.prose strong{font-weight:600}
.steps{display:flex;flex-direction:column;gap:6px}
.step{all:unset;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 10px;padding:10px;border-radius:8px;border:1px solid transparent}
.step .num{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.step b{font-family:var(--f-display);font-stretch:85%;font-size:17px;font-weight:650}
.step .tx{grid-column:2;font-size:15px;color:var(--muted);display:none}
.step.on{background:var(--hl);border-color:var(--line)}
.step.on .num{background:var(--ink);color:var(--on-accent);border-color:var(--ink)}
.step.on .tx{display:block;color:var(--ink)}
.step.seen .num{border-color:var(--ink)}
.tl{position:relative;display:flex;flex-direction:column;gap:2px;padding-left:16px;border-left:2px solid var(--line);margin-left:8px}
.tl-ev{all:unset;cursor:pointer;display:block;padding:8px 10px;border-radius:8px;position:relative}
.tl-ev::before{content:"";position:absolute;left:-23px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--ink)}
.tl-ev .y{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tl-ev b{display:block;font-family:var(--f-display);font-stretch:85%;font-size:17px;font-weight:650;line-height:1.2}
.tl-ev .tx{display:none;font-size:15px;margin-top:4px}
.tl-ev.on{background:var(--hl)}
.tl-ev.on::before{background:var(--ink)}
.tl-ev.on .tx{display:block}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:560px){.cmp{grid-template-columns:1fr}}
.cmp .col{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}
.cmp ul{margin:6px 0 0;padding-left:1.1em;font-size:15px}
.cmp .common{grid-column:1/-1;border-style:dashed}
.opt{all:unset;cursor:pointer;display:block;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:15px}
.opt.ok{border-color:var(--ok);box-shadow:inset 0 0 0 1.5px var(--ok)}
.opt.no{border-color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad);opacity:.8}
.outs{display:flex;flex-wrap:wrap;gap:8px 18px}
.out{font-family:var(--f-mono);font-size:13px}
.out span{color:var(--muted);margin-right:6px}
.out b{font-size:16px}
input[type=range]{width:100%;accent-color:var(--ink)}
canvas.seats{width:100%;display:block}
.stop{border:1px dashed var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}

/* flashcard */
.flash{min-height:180px;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:center;cursor:pointer}
.flash .front{font-family:var(--f-display);font-stretch:85%;font-size:22px;font-weight:650;line-height:1.2}
.flash .back{font-size:16px;border-top:1px dashed var(--line);padding-top:10px}

/* breath */
.breath{width:200px;height:200px;margin:8px auto;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:14px;
  background:radial-gradient(circle,var(--paper) 30%,transparent 70%);border:2px solid var(--fede);transform:scale(.6);transition:transform 4s ease-in-out}
.prayer{white-space:pre-line;font-size:16.5px;line-height:1.6}
.sent{font-size:18px;line-height:1.5;min-height:110px}
.thumb{width:84px;height:84px;object-fit:cover;border-radius:8px;flex:none;background:var(--soft)}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<nav class="bottom" id="nav" aria-label="Sezioni"></nav>

<script>
"use strict";
/* ======================================================================
   ULISSE — v0.1
   Struttura: utilità · stato · aree e missioni · motore lezioni ·
   sezioni (Oggi, Notizie, Scopri, Tecnico, Specchio, Quaderno) · avvio
   ====================================================================== */

/* ---------------- utilità ---------------- */
const $ = (s, el = document) => el.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(Infinity)) {
    if (k === null || k === undefined || k === false) continue;
    el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
  return el;
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); };
const stripTags = s => { const d = document.createElement('div'); d.innerHTML = s || ''; return (d.textContent || '').replace(/\s+/g, ' ').trim(); };
function seeded(str) { let x = 0; for (const c of str) x = (x * 31 + c.charCodeAt(0)) >>> 0; return () => { x = (x * 1664525 + 1013904223) >>> 0; return x / 4294967296; }; }
function fmtDate(s) { try { return new Date(s).toLocaleString('it-IT', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }
function md(src) { // markdown minimo: paragrafi, elenchi "- ", **grassetto**, *corsivo*
  const inl = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>');
  return String(src || '').split(/\n\s*\n/).map(b => {
    const lines = b.split('\n');
    if (lines.every(l => /^\s*-\s+/.test(l))) return '<ul>' + lines.map(l => '<li>' + inl(l.replace(/^\s*-\s+/, '')) + '</li>').join('') + '</ul>';
    return '<p>' + inl(b).replace(/\n/g, '<br>') + '</p>';
  }).join('');
}
function toast(msg) { const t = h('div', { class: 'toast', role: 'status' }, msg); document.body.append(t); setTimeout(() => t.remove(), 2400); }
async function copyText(txt) {
  try { await navigator.clipboard.writeText(txt); toast('Copiato'); return true; }
  catch (e) {
    const ta = h('textarea', { readonly: true, style: { minHeight: '200px' } }); ta.value = txt;
    openSheet('Copia il testo', h('div', { class: 'card' }, h('p', { class: 'small muted' }, 'La copia automatica non è disponibile: tieni premuto e copia.'), ta));
    setTimeout(() => { ta.focus(); ta.select(); }, 50);
    return false;
  }
}
function openSheet(title, content, onClose) {
  const bg = h('div', { class: 'sheet-bg' });
  const close = () => { bg.remove(); stopSpeak(); onClose && onClose(); };
  const sh = h('div', { class: 'sheet', role: 'dialog', 'aria-label': title },
    h('div', { class: 'sheet-head' }, h('h2', null, title), h('button', { class: 'iconbtn', 'aria-label': 'Chiudi', onclick: close }, '✕')),
    content);
  bg.append(sh);
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
  document.body.append(bg);
  return close;
}
async function getJSON(url) { const r = await fetch(url); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }

/* voce (sintesi vocale del browser, gratuita) */
let voiceIt = null;
function pickVoice() { try { const v = speechSynthesis.getVoices(); voiceIt = v.find(x => /it[-_]IT/i.test(x.lang)) || v.find(x => /^it/i.test(x.lang)) || null; } catch (e) { } }
try { speechSynthesis.onvoiceschanged = pickVoice; pickVoice(); } catch (e) { }
function speak(text, onend) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = 'it-IT'; if (voiceIt) u.voice = voiceIt; u.rate = 1.02;
    if (onend) u.onend = onend;
    speechSynthesis.speak(u); return true;
  } catch (e) { toast('Voce non disponibile su questo dispositivo'); return false; }
}
function stopSpeak() { try { speechSynthesis.cancel(); } catch (e) { } }

/* ---------------- stato ---------------- */
const KEY = 'ulisse.v1';
function defaults() {
  return {
    v: 1, name: 'Andrea', level: 2, mode: 'orizzontale',
    feeds: [
      { name: 'ANSA · Primo piano', url: 'https://www.ansa.it/sito/ansait_rss.xml' },
      { name: 'ANSA · Politica', url: 'https://www.ansa.it/sito/notizie/politica/politica_rss.xml' },
      { name: 'ANSA · Cronaca', url: 'https://www.ansa.it/sito/notizie/cronaca/cronaca_rss.xml' },
      { name: 'Il Post', url: 'https://www.ilpost.it/feed/' }
    ],
    niche: ['semiconduttori', 'spazio', 'Firenze'],
    techKw: ['MMIC 60 GHz', 'reconfigurable intelligent surface active', 'negative resistance amplifier'],
    interests: {}, explored: {}, favs: [], log: [], quests: [], cards: [], journal: [], lessons: {}, progress: {}, lastLesson: null
  };
}
function load() {
  try { const r = localStorage.getItem(KEY); if (r) return Object.assign(defaults(), JSON.parse(r)); } catch (e) { }
  return defaults();
}
let S = load();
let storageOk = true;
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; } catch (e) { storageOk = false; } }

/* ---------------- aree, registro, equilibrio ---------------- */
const AREAS = {
  lavoro: { n: 'Studio e lavoro' }, fede: { n: 'Fede' }, famiglia: { n: 'Famiglia' }, amici: { n: 'Amici' },
  corpo: { n: 'Corpo' }, mondo: { n: 'Mondo' }, scoperta: { n: 'Scoperta' }
};
const areaColor = a => `var(--${AREAS[a] ? a : 'scoperta'})`;
const areaTag = a => h('span', { class: 'tag', style: { color: areaColor(a) } }, (AREAS[a] || AREAS.scoperta).n);
function addLog(area, kind, title, w = 1) { S.log.push({ d: today(), t: Date.now(), area, kind, title, w }); if (S.log.length > 3000) S.log = S.log.slice(-3000); save(); }
function balance(days = 14) {
  const from = daysAgo(days - 1), out = {}; for (const a in AREAS) out[a] = 0;
  for (const e of S.log) if (e.d >= from && out[e.area] !== undefined) out[e.area] += e.w || 1;
  return out;
}
function bumpInterest(keys, d) { for (const k of keys || []) { S.interests[k] = (S.interests[k] || 0) + d; } save(); }

/* modelli di missione: [testo, sezione da aprire o null] */
const QT = {
  lavoro: {
    main: ['Blocca due ore di lavoro profondo sulla tesi, notifiche spente', 'Leggi un paper dalla sezione Tecnico e scrivi tre punti nel Quaderno', 'Sistema una parte della tesi che rimandi da giorni'],
    side: ['Prepara la lista delle cose di domani', 'Salva nel Quaderno un concetto tecnico che hai capito oggi', 'Rispondi a una mail di lavoro che stai rimandando']
  },
  fede: {
    main: ['Partecipa a una Messa o a un momento di preghiera con altri', 'Fai una Lectio divina sul Vangelo del giorno (Specchio)', 'Dedica un\'ora a un servizio concreto per qualcuno'],
    side: ['Fai l\'esame di coscienza stasera (Specchio)', 'Prega per una persona precisa e diglielo, se ti va', 'Leggi un salmo con calma']
  },
  famiglia: {
    main: ['Passa un\'ora senza telefono con qualcuno di famiglia: cena, passeggiata o un gioco', 'Chiedi a un familiare più grande di raccontarti un episodio della sua giovinezza', 'Organizza qualcosa insieme per il fine settimana'],
    side: ['Chiama un parente che senti poco', 'Fai in casa una cosa che di solito fa un altro', 'Manda una foto o un ricordo a qualcuno di famiglia']
  },
  amici: {
    main: ['Proponi a un amico un\'uscita concreta, con giorno e ora', 'Invita qualcuno a provare con te una cosa nuova', 'Vai a un evento dove conosci poche persone'],
    side: ['Scrivi a un amico che non senti da mesi', 'Di\' a qualcuno cosa apprezzi di lui', 'Chiedi a un amico come sta davvero, e ascolta']
  },
  corpo: {
    main: ['Cammina o pedala almeno 45 minuti all\'aperto', 'Stasera a letto entro mezzanotte, telefono fuori dalla camera', 'Cucina un pasto vero, con calma'],
    side: ['Dieci minuti di stretching', 'Fai le scale invece dell\'ascensore per tutto il giorno', 'Un esercizio di respiro (Specchio)']
  },
  mondo: {
    main: ['Completa una lezione su una notizia (Notizie)', 'Prendi una notizia e risali la sua storia fino a un evento di almeno 50 anni fa', 'Confronta come due fonti diverse raccontano lo stesso fatto'],
    side: ['Leggi tre notizie e salva un concetto nel Quaderno', 'Usa «Capire» su una notizia che non ti è chiara', 'Ascolta un podcast di attualità mentre fai altro']
  },
  scoperta: {
    main: ['Esplora un argomento mai visto in Scopri e seguilo per tre rami', 'Prova con le mani una cosa nuova: un disegno, un piatto, un lavoretto', 'Vai in un luogo vicino a casa dove non sei mai entrato'],

  const host = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '12px' } });
  const close = openSheet('Ripasso', host);
  let i = 0, done = 0;
  function show() {
    if (i >= queue.length) { if (done) addLog(queue[0].area, 'ripasso', `${done} carte ripassate`); host.replaceChildren(h('div', { class: 'card' }, h('h3', null, 'Fatto.'), h('p', null, `Hai ripassato ${done} carte.`), h('button', { class: 'btn primary', onclick: () => { close(); render(); } }, 'Chiudi'))); return; }
    const c = queue[i]; let open = false;
    const back = h('div', { class: 'back', hidden: true }, c.back);
    const gr = h('div', { class: 'row', hidden: true }, ['Di nuovo', 'Difficile', 'Bene', 'Facile'].map((l, q) => h('button', { class: 'btn small grow' + (q === 2 ? ' primary' : ''), onclick: () => { grade(c, q); done++; i++; show(); } }, l)));
    const fl = h('div', { class: 'card flash', onclick: () => { if (open) return; open = true; back.hidden = false; gr.hidden = false; hint.remove(); } },
      h('span', { class: 'mono' }, `${i + 1}/${queue.length} · ${c.from || ''}`), h('div', { class: 'front' }, c.front), back);
    const hint = h('span', { class: 'mono' }, 'tocca per vedere la risposta'); fl.append(hint);
    host.replaceChildren(fl, gr);
  }
  show();
}

async function fetchFeed(url) {
  const parse = xml => {
    const doc = new DOMParser().parseFromString(xml, 'text/xml');
    const items = [...doc.querySelectorAll('item, entry')].slice(0, 25);
    if (!items.length) throw new Error('vuoto');
    return items.map(it => ({
      title: stripTags(it.querySelector('title')?.textContent),
      link: it.querySelector('link')?.getAttribute('href') || it.querySelector('link')?.textContent?.trim(),
      date: it.querySelector('pubDate, updated, published')?.textContent,
      desc: stripTags(it.querySelector('description, summary, content')?.textContent).slice(0, 320),
      src: stripTags(it.querySelector('source')?.textContent || '')
    }));
  };
  try { const r = await fetch(url); if (!r.ok) throw 0; return parse(await r.text()); }
  catch (e) {
    const j = await getJSON('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(url));
    if (j.status !== 'ok') throw new Error('feed non raggiungibile');
    return j.items.map(it => ({ title: stripTags(it.title), link: it.link, date: it.pubDate, desc: stripTags(it.description).slice(0, 320), src: stripTags(it.author || '') }));
  }
}
const W = 'https://it.wikipedia.org';
const wikiSummary = t => getJSON(`${W}/api/rest_v1/page/summary/${encodeURIComponent(t.replace(/ /g, '_'))}`);
async function wikiSearch(q, n = 6) { const j = await getJSON(`${W}/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q)}&srlimit=${n}&format=json&origin=*`); return j.query.search.map(s => ({ title: s.title, snippet: stripTags(s.snippet) })); }
async function wikiSections(t) { const j = await getJSON(`${W}/w/api.php?action=parse&page=${encodeURIComponent(t)}&prop=sections&redirects=1&format=json&origin=*`); return (j.parse?.sections || []).filter(s => s.toclevel === 1 && !/^(Note|Bibliografia|Voci correlate|Collegamenti esterni|Altri progetti|Altri progetti)$/i.test(stripTags(s.line))); }
async function wikiSectionText(t, idx) {
  const j = await getJSON(`${W}/w/api.php?action=parse&page=${encodeURIComponent(t)}&section=${idx}&prop=text&redirects=1&disableeditsection=1&format=json&origin=*`);
  const doc = new DOMParser().parseFromString(j.parse.text['*'], 'text/html');
  doc.querySelectorAll('sup, .reference, .mw-editsection, table, style, .thumb, figure').forEach(e => e.remove());
  return [...doc.querySelectorAll('p, li')].map(e => e.textContent.replace(/\s+/g, ' ').trim()).filter(x => x.length > 40).slice(0, 14);
}

function dailyTopic() {
  const r = seeded('topic' + today());
  const catSeen = {}; for (const id in S.explored) { const t = TOP[id]; if (t) catSeen[t.c] = (catSeen[t.c] || 0) + S.explored[id]; }
  const pool = TOPICS.filter(t => (S.interests[t.id] || 0) > -2);
  // peso: argomenti mai visti in categorie poco esplorate valgono di più (allarga la visione)
  const ws = pool.map(t => (S.explored[t.id] ? 0.3 : 1) / (1 + (catSeen[t.c] || 0) * 0.5) * (1 + Math.max(0, S.interests[t.id] || 0) * 0.1));
  let x = r() * ws.reduce((a, b) => a + b, 0);
  for (let i = 0; i < pool.length; i++) { x -= ws[i]; if (x <= 0) return pool[i]; }
  return pool[0];
}

async function loadNews(list) {
  const key = newsTab;

    if (!newsCache[key] || Date.now() - newsCache[key].t > 15 * 60e3) {
      const feeds = key === 'principali' ? S.feeds : S.niche.map(k => ({ name: k, url: `https://news.google.com/rss/search?q=${encodeURIComponent(k)}&hl=it&gl=IT&ceid=IT:it` }));
      const res = await Promise.allSettled(feeds.map(f => fetchFeed(f.url).then(items => items.map(i => Object.assign(i, { feed: f.name })))));
      let items = res.filter(r => r.status === 'fulfilled').flatMap(r => r.value);
      if (!items.length) throw new Error('nessun feed');
      const seen = new Set(); items = items.filter(i => { const k = i.title.toLowerCase().slice(0, 60); if (seen.has(k)) return false; seen.add(k); return true; });
      items.sort((a, b) => (Date.parse(b.date) || 0) - (Date.parse(a.date) || 0));
      newsCache[key] = { t: Date.now(), items: items.slice(0, 40) };

    const secBox = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '6px' } }, h('div', { class: 'empty' }, 'Carico i capitoli…'));
    deepBox.append(h('h3', null, 'Scendi più a fondo'), secBox);

      secBox.replaceChildren(...secs.slice(0, n).map(s => {
        const body = h('div', { class: 'prose small', hidden: true });
        const btn = h('button', { class: 'card flat', style: { cursor: 'pointer', textAlign: 'left' }, onclick: async () => {
          if (!body.hidden) { body.hidden = true; return; }
          body.hidden = false; body.textContent = 'Carico…';
          try { const ps = await wikiSectionText(t.w, s.index); body.replaceChildren(...ps.slice(0, S.level <= 2 ? 3 : 14).map(p => h('p', null, p))); addLog('scoperta', 'approfondisci', t.n + ' · ' + stripTags(s.line), 0.5); bumpInterest([id], 1); }

      }));

  }
}

/* ---------- TECNICO ---------- */
let techQ = null;
function viewTecnico() {
  techQ = techQ || S.techKw[0];
  const list = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '10px' } }, h('div', { class: 'empty' }, 'Cerco gli articoli più recenti…'));
  const inp = h('input', { type: 'search', placeholder: 'Cerca un argomento tecnico (in inglese funziona meglio)', value: '' });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && inp.value.trim()) { techQ = inp.value.trim(); render(); } });
  loadPapers(techQ, list);
  return [header('Tecnico', 'paper resi digeribili'),
    h('div', { class: 'scrollx' }, S.techKw.map(k => h('button', { class: 'chip', 'aria-pressed': k === techQ ? 'true' : 'false', onclick: () => { techQ = k; render(); } }, k))),
    inp, h('p', { class: 'small muted', style: { margin: 0 } }, 'Fonte: OpenAlex, catalogo aperto e gratuito della ricerca. Ultimi due anni, ordinati per pertinenza.'), list];
}
async function loadPapers(q, list) {
  try {
    const from = new Date(); from.setFullYear(from.getFullYear() - 2);
    const j = await getJSON(`https://api.openalex.org/works?search=${encodeURIComponent(q)}&filter=from_publication_date:${from.toISOString().slice(0, 10)},has_abstract:true&per_page=12`);
    if (techQ !== q) return;
    const ws = j.results || [];
    if (!ws.length) { list.replaceChildren(h('div', { class: 'empty' }, 'Nessun risultato.')); return; }
    list.replaceChildren(...ws.map(paperCard));
  } catch (e) { list.replaceChildren(netError('OpenAlex')); }
}
function abstractOf(w) {
  const inv = w.abstract_inverted_index; if (!inv) return '';
  const arr = []; for (const [word, pos] of Object.entries(inv)) for (const p of pos) arr[p] = word;
  return arr.join(' ');
}
function paperCard(w) {
  const abs = abstractOf(w);
  const venue = w.primary_location?.source?.display_name || '';
  const link = w.open_access?.oa_url || w.doi || w.id;
  return h('div', { class: 'card' },
    h('div', { class: 'src mono' }, [w.publication_year, venue, (w.cited_by_count || 0) + ' citazioni', w.open_access?.is_oa ? 'open access' : null].filter(Boolean).join(' · ')),
    h('h3', null, stripTags(w.display_name)),
    abs && h('p', { class: 'small muted', style: { margin: 0 } }, abs.slice(0, 220) + (abs.length > 220 ? '…' : '')),
    h('div', { class: 'row' },
      abs && h('button', { class: 'btn small primary', onclick: () => lightRead(w, abs) }, 'Leggi in modo leggero'),
      link && h('a', { class: 'btn small', href: link, target: '_blank', rel: 'noopener' }, 'Apri'),
      h('button', { class: 'btn small', onclick: () => askClaudeSheet('tecnico', stripTags(w.display_name), 'Abstract: ' + abs.slice(0, 1500) + (link ? ' Link: ' + link : '')) }, 'Lezione')));
}
function lightRead(w, abs) {
  const sents = abs.match(/[^.!?]+[.!?]+(\s|$)/g) || [abs];
  let i = 0;
  const host = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '12px' } });
  openSheet('Lettura leggera', host);
  addLog('lavoro', 'paper', stripTags(w.display_name), 1);
  function show() {
    host.replaceChildren(
      h('span', { class: 'mono' }, stripTags(w.display_name)),
      h('div', { class: 'card' }, h('span', { class: 'mono' }, `frase ${i + 1} di ${sents.length}`), h('div', { class: 'sent' }, sents[i].trim())),
      h('div', { class: 'row' },
        h('button', { class: 'btn', disabled: i === 0, onclick: () => { i--; show(); } }, '‹'),
        h('button', { class: 'btn primary grow', disabled: i === sents.length - 1, onclick: () => { i++; show(); } }, 'Avanti ›'),
        h('button', { class: 'btn', onclick: () => speak(sents[i]) }, '🔊')),
      h('button', { class: 'btn small', onclick: () => { addCard('Dal paper «' + stripTags(w.display_name).slice(0, 80) + '»: cosa afferma questo passaggio?', sents[i].trim(), 'lavoro', 'Tecnico'); toast('Frase salvata nel Quaderno'); } }, '+ Salva questa frase nel Quaderno'),
      h('p', { class: 'small muted', style: { margin: 0 } }, 'Una frase alla volta, senza fretta. Per una spiegazione completa con schemi e passaggi usa «Lezione».'));
  }
  show();
}

/* ---------- SPECCHIO ---------- */
const PRAYERS = {
  'Padre nostro': 'Padre nostro, che sei nei cieli,\nsia santificato il tuo nome,\nvenga il tuo regno,\nsia fatta la tua volontà,\ncome in cielo così in terra.\nDacci oggi il nostro pane quotidiano,\ne rimetti a noi i nostri debiti\ncome anche noi li rimettiamo ai nostri debitori,\ne non abbandonarci alla tentazione,\nma liberaci dal male.\nAmen.',
  'Ave Maria': 'Ave, o Maria, piena di grazia,\nil Signore è con te.\nTu sei benedetta fra le donne\ne benedetto è il frutto del tuo seno, Gesù.\nSanta Maria, Madre di Dio,\nprega per noi peccatori,\nadesso e nell\'ora della nostra morte.\nAmen.',
  'Gloria': 'Gloria al Padre e al Figlio e allo Spirito Santo.\nCome era nel principio, e ora e sempre,\nnei secoli dei secoli.\nAmen.'

const GUIDES = {
  lectio: { n: 'Lectio divina', area: 'fede', intro: 'Prendi il Vangelo del giorno o un brano che ami. Quattro tempi, senza fretta.', steps: [
    ['Lectio · leggere', 'Leggi il brano lentamente, anche due volte. Nota una parola o una frase che ti colpisce.', 180],
    ['Meditatio · meditare', 'Ripeti dentro di te quella parola. Cosa dice della tua vita, oggi?', 240],
    ['Oratio · pregare', 'Rispondi a Dio con parole tue: un grazie, una richiesta, una fatica.', 180],
    ['Contemplatio · restare', 'Resta in silenzio, senza dover dire o capire altro.', 180]] },
  examen: { n: 'Esame di coscienza', area: 'fede', intro: 'L\'esame di sant\'Ignazio: cinque passi per rileggere la giornata, la sera.', steps: [
    ['Presenza', 'Fermati e ricordati che non sei solo davanti alla tua giornata.', 60],
    ['Gratitudine', 'Ripensa a tre cose belle di oggi, anche piccole. Ringrazia.', 120],
    ['Rilettura', 'Ripercorri la giornata come un film. Dove ti sei sentito vivo? Dove ti sei spento?', 180],
    ['Perdono', 'Guarda con onestà cosa non è andato. Chiedi perdono, senza processarti.', 120],
    ['Domani', 'Scegli una cosa concreta per domani.', 60]] },
  respiro: { n: 'Respiro', area: 'corpo', intro: 'Inspira 4 secondi, trattieni 4, espira 6. Bastano pochi minuti per calmare il corpo.', breath: true }
};
function viewSpecchio() {

    h('div', { class: 'prayer' }, PRAYERS[n]), h('div', { class: 'row' }, h('button', { class: 'btn small', onclick: () => speak(PRAYERS[n]) }, '🔊 Recita con la voce'), h('button', { class: 'btn small', onclick: () => { addLog('fede', 'preghiera', n); toast('Segnata'); } }, '✓ Pregata')));
  showPrayer('Padre nostro');
  const jr = S.journal.slice(-5).reverse();
  return [header('Specchio', 'fermarsi, pregare, conoscersi'),
    h('div', { class: 'card' }, h('h2', null, 'Pratiche guidate'),
      Object.entries(GUIDES).map(([k, g]) => h('button', { class: 'card flat', style: { cursor: 'pointer', textAlign: 'left' }, onclick: () => guideSheet(k) }, h('b', null, g.n), h('span', { class: 'small muted' }, g.intro)))),
    h('div', { class: 'card flat' }, h('h3', null, 'Il Vangelo di oggi'), h('p', { class: 'small', style: { margin: 0 } }, 'Leggilo e poi fai la Lectio divina qui sopra.'),
      h('a', { class: 'btn small', href: 'https://www.vaticannews.va/it/vangelo-del-giorno-e-parola-del-giorno.html', target: '_blank', rel: 'noopener' }, 'Apri il Vangelo del giorno')),
    h('h2', null, 'Preghiere'), prayer,
    h('div', { class: 'card' }, h('h2', null, 'Approfondire la fede'),
      h('p', { class: 'small', style: { margin: 0 } }, 'Scegli un tema e ti preparo una lezione, con fonti dalla Bibbia e dal Catechismo.'),
      h('div', { class: 'chips' }, ['I sacramenti', 'Le parabole di Gesù', 'Il Credo, frase per frase', 'La Dottrina sociale', 'Chi erano i profeti', 'La storia della Chiesa in 10 tappe'].map(s => h('button', { class: 'chip', onclick: () => askClaudeSheet('fede', s) }, s))),
      h('a', { class: 'btn small ghost', href: 'https://www.vatican.va/archive/catechism_it/index_it.htm', target: '_blank', rel: 'noopener' }, 'Catechismo della Chiesa cattolica'),
      Object.values(allLessons()).filter(l => l.kind === 'fede').map(lessonCard)),
    h('div', { class: 'card' }, h('div', { class: 'row between' }, h('h2', null, 'Diario'), h('button', { class: 'btn small', onclick: journalSheet }, '+ Scrivi')),
      jr.length ? jr.map(j => h('div', { class: 'card flat' }, h('span', { class: 'mono' }, j.d + (j.from ? ' · ' + j.from : '')), j.prompt && h('b', { class: 'small' }, j.prompt), h('div', { class: 'small' }, j.text)))

function journalSheet() {
  const prompts = ['Cosa mi ha dato energia oggi?', 'Cosa ho evitato e perché?', 'Di cosa sono grato?', 'Cosa vorrei imparare se avessi tutto il tempo del mondo?', 'Con chi vorrei passare più tempo?'];
  const p = prompts[Math.floor(Math.random() * prompts.length)];
  const ta = h('textarea', { placeholder: p });
  const close = openSheet('Diario', h('div', { class: 'card' }, h('h3', null, p), ta, h('button', { class: 'btn primary', onclick: () => {
    if (!ta.value.trim()) return; S.journal.push({ id: uid(), d: today(), prompt: p, text: ta.value.trim() }); addLog('fede', 'diario', p); save(); close(); render();
  } }, 'Salva')));
}
function guideSheet(k) {
  const g = GUIDES[k], host = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '12px' } });
  let timer = null, alive = true;
  openSheet(g.n, host, () => { alive = false; clearTimeout(timer); clearInterval(timer); });
  if (g.breath) {
    let mins = 3;
    const circle = h('div', { class: 'breath' }, 'pronto');
    const status = h('div', { class: 'mono', style: { textAlign: 'center' } }, '');
    const start = h('button', { class: 'btn primary', onclick: () => {
      start.disabled = true; const end = Date.now() + mins * 60e3; const phases = [['inspira', 4000, 1], ['trattieni', 4000, 1], ['espira', 6000, .6]]; let p = 0;
      const step = () => {
        if (!alive) return;
        if (Date.now() > end) { circle.textContent = 'fatto'; circle.style.transform = 'scale(.6)'; addLog(g.area, 'respiro', mins + ' minuti'); start.disabled = false; return; }
        const [l, ms, sc] = phases[p % 3]; circle.textContent = l; circle.style.transition = `transform ${ms}ms ease-in-out`; circle.style.transform = `scale(${sc})`;
        status.textContent = Math.ceil((end - Date.now()) / 60e3) + ' min rimasti'; p++; timer = setTimeout(step, ms);
      };
      step();
    } }, 'Inizia');

    const paint = () => mchips.replaceChildren(...[3, 5, 10].map(m => h('button', { class: 'chip', 'aria-pressed': m === mins ? 'true' : 'false', onclick: () => { mins = m; paint(); } }, m + ' min')));
    paint();
    host.append(h('p', { style: { margin: 0 } }, g.intro), mchips, circle, status, start);
    return;
  }
  let i = 0;
  const show = () => {
    clearInterval(timer);
    if (i >= g.steps.length) { addLog(g.area, 'pratica', g.n, 2); host.replaceChildren(h('div', { class: 'card' }, h('h3', null, 'Amen.'), h('p', { style: { margin: 0 } }, 'Se vuoi, scrivi una riga nel diario.'), h('button', { class: 'btn', onclick: journalSheet }, 'Scrivi nel diario'))); return; }
    const [t, tx, sec] = g.steps[i]; let left = sec;
    const clock = h('div', { class: 'mono' }, '');
    const tick = () => { clock.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`; if (left-- <= 0) { clearInterval(timer); clock.textContent = 'quando vuoi, vai avanti'; } };
    host.replaceChildren(h('p', { class: 'small muted', style: { margin: 0 } }, g.intro),
      h('div', { class: 'card' }, h('span', { class: 'mono' }, `passo ${i + 1} di ${g.steps.length}`), h('h2', null, t), h('p', { style: { margin: 0, fontSize: '17px' } }, tx), clock),
      h('div', { class: 'row' }, h('button', { class: 'btn', onclick: () => speak(t + '. ' + tx) }, '🔊'), h('button', { class: 'btn primary grow', onclick: () => { i++; stopSpeak(); show(); } }, i === g.steps.length - 1 ? 'Concludi' : 'Avanti ›')));
    tick(); timer = setInterval(tick, 1000);
  };
  show();
}

/* ---------- QUADERNO ---------- */
let qTab = 'carte';
function viewQuaderno() {
  const due = dueCards().length;
  const tabs = h('div', { class: 'chips' }, [['carte', 'Carte'], ['lezioni', 'Lezioni'], ['storico', 'Storico']].map(([k, l]) => h('button', { class: 'chip', 'aria-pressed': k === qTab ? 'true' : 'false', onclick: () => { qTab = k; render(); } }, l)));

      const q = flt.value.toLowerCase();

      box.replaceChildren(...(cs.length ? cs.map(c => h('details', { class: 'card flat' }, h('summary', { style: { cursor: 'pointer' } }, h('b', null, c.front)),
        h('p', { style: { margin: '6px 0' } }, c.back), h('div', { class: 'row between' }, h('span', { class: 'mono' }, (c.from || '') + ' · prossimo ripasso ' + c.due),
          h('button', { class: 'btn small ghost', onclick: () => { S.cards = S.cards.filter(x => x !== c); save(); paint(); } }, 'Elimina'))))
        : [h('div', { class: 'empty' }, 'Nessuna carta. Le lezioni, le scoperte e i paper ti permettono di salvarne.')]));
    };

    body = [h('div', { class: 'row' }, h('button', { class: 'btn grow' + (due ? ' primary' : ''), onclick: reviewSheet }, due ? `Ripassa ${due} carte` : 'Niente da ripassare oggi'), h('button', { class: 'btn', onclick: newCardSheet }, '+ Carta')), flt, box];
  } else if (qTab === 'lezioni') {

      Object.values(allLessons()).map(L => h('div', null, lessonCard(L), S.lessons[L.id] && h('button', { class: 'btn small ghost', onclick: () => { delete S.lessons[L.id]; save(); render(); } }, 'Elimina lezione')))];

      : h('div', { class: 'empty' }, 'Ancora nulla.')];
  }
  return [header('Quaderno', `${S.cards.length} carte · ${Object.keys(allLessons()).length} lezioni`), tabs, ...body];
}

      h('div', { class: 'row' }, h('button', { class: 'btn', onclick: () => copyText(JSON.stringify(S)) }, 'Copia backup'),
        h('button', { class: 'btn', onclick: () => { try { const a = h('a', { href: URL.createObjectURL(new Blob([JSON.stringify(S)], { type: 'application/json' })), download: 'ulisse-backup-' + today() + '.json' }); document.body.append(a); a.click(); a.remove(); } catch (e) { toast('Download non disponibile qui'); } } }, 'Scarica file')),
      imp, h('button', { class: 'btn', onclick: () => { try { const d = JSON.parse(imp.value); if (!d.v) throw 0; S = Object.assign(defaults(), d); save(); close(); render(); toast('Backup ripristinato'); } catch (e) { toast('Backup non valido'); } } }, 'Ripristina')),
    h('div', { class: 'card flat' }, h('span', { class: 'mono' }, 'Ulisse v0.1'), h('p', { class: 'small muted', style: { margin: 0 } }, 'Fonti gratuite: feed RSS dei giornali, Google News, Wikipedia, OpenAlex. Nessun account, nessun costo.'))));
}

/* ---------- rendering e navigazione ---------- */
const VIEWS = { oggi: viewOggi, notizie: viewNotizie, scopri: viewScopri, tecnico: viewTecnico, specchio: viewSpecchio, quaderno: viewQuaderno };
function render() {
  app.replaceChildren(...VIEWS[route]().flat(Infinity).filter(Boolean));
  $('#nav').replaceChildren(...Object.entries(SECTIONS).map(([k, l]) => h('button', { 'aria-current': k === route ? 'page' : null, onclick: () => go(k) }, h('span', { html: ICONS[k] }), l)));
}
function go(k) { if (!VIEWS[k]) k = 'oggi'; route = k; document.querySelectorAll('.sheet-bg').forEach(e => e.remove()); stopSpeak(); try { if (location.hash !== '#' + k) history.replaceState(null, '', '#' + k); } catch (e) { } render(); window.scrollTo(0, 0); }
window.addEventListener('hashchange', () => { const k = location.hash.slice(1); if (VIEWS[k] && k !== route) go(k); });
go(location.hash.slice(1) || 'oggi');

/* app installabile: service worker per l'uso offline (ignorato dove non è permesso) */
if ('serviceWorker' in navigator && location.protocol === 'https:') { navigator.serviceWorker.register('sw.js').catch(() => { }); }
